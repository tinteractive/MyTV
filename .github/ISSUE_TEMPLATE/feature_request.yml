name: Suggest an idea
description: Something MyTV Launcher could do (better)
labels: [idea]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like MyTV to do, and why would it help you?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: TV or box (optional)
      placeholder: "e.g. Philips 55PUS8506, NVIDIA Shield"
