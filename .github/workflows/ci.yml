name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow builds and checks; it publishes nothing and uses no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Also checks that gradle-wrapper.jar is an official Gradle wrapper.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests (both editions)
        run: ./gradlew --no-daemon :app:testGithubDebugUnitTest :app:testPlayDebugUnitTest

      - name: Android lint (both editions)
        run: ./gradlew --no-daemon :app:lintGithubDebug :app:lintPlayDebug

      - name: detekt
        run: ./gradlew --no-daemon detekt

      # Release builds without a signing key (R8 on): proves the shrunk app still builds. The APKs are unsigned.
      - name: Build debug and release
        run: ./gradlew --no-daemon :app:assembleGithubDebug :app:assemblePlayDebug :app:assembleGithubRelease :app:assemblePlayRelease

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/build/reports/
          retention-days: 14
